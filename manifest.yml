# SpecPage manifest
# https://developer.atlassian.com/platform/forge/manifest-reference/
modules:
  macro:
    - key: specpage-viewer
      resource: ui/macro
      resolver:
        function: resolver
      title: OpenAPI / Swagger docs (SpecPage)
      description: Interactive API docs from an OpenAPI or Swagger spec - page attachment, Git, URL or pasted text.
      category: embed
      # Let guests / anonymous users read docs on public spaces.
      # Try it out is still licensed-users-only (checked in the resolver).
      unlicensedAccess:
        - unlicensed
        - anonymous
      emitsReadyEvent: true
      # Pasting a link to a spec file (or a SwaggerHub API) inserts the macro.
      # Only spec-looking file names, so ordinary code links are left alone.
      autoConvert:
        matchers:
          - pattern: https://github.com/*/*/blob/*/openapi.yaml
          - pattern: https://github.com/*/*/blob/*/openapi.yml
          - pattern: https://github.com/*/*/blob/*/openapi.json
          - pattern: https://github.com/*/*/blob/*/swagger.yaml
          - pattern: https://github.com/*/*/blob/*/swagger.yml
          - pattern: https://github.com/*/*/blob/*/swagger.json
          - pattern: https://github.com/*/*/blob/*/*/openapi.yaml
          - pattern: https://github.com/*/*/blob/*/*/openapi.yml
          - pattern: https://github.com/*/*/blob/*/*/openapi.json
          - pattern: https://github.com/*/*/blob/*/*/swagger.yaml
          - pattern: https://github.com/*/*/blob/*/*/swagger.yml
          - pattern: https://github.com/*/*/blob/*/*/swagger.json
          - pattern: https://github.com/*/*/blob/*/*/*/openapi.yaml
          - pattern: https://github.com/*/*/blob/*/*/*/openapi.yml
          - pattern: https://github.com/*/*/blob/*/*/*/openapi.json
          - pattern: https://github.com/*/*/blob/*/*/*/swagger.yaml
          - pattern: https://github.com/*/*/blob/*/*/*/swagger.yml
          - pattern: https://github.com/*/*/blob/*/*/*/swagger.json
          - pattern: https://gitlab.com/*/*/-/blob/*/openapi.yaml
          - pattern: https://gitlab.com/*/*/-/blob/*/openapi.yml
          - pattern: https://gitlab.com/*/*/-/blob/*/openapi.json
          - pattern: https://gitlab.com/*/*/-/blob/*/swagger.yaml
          - pattern: https://gitlab.com/*/*/-/blob/*/swagger.yml
          - pattern: https://gitlab.com/*/*/-/blob/*/swagger.json
          - pattern: https://gitlab.com/*/*/-/blob/*/*/openapi.yaml
          - pattern: https://gitlab.com/*/*/-/blob/*/*/openapi.yml
          - pattern: https://gitlab.com/*/*/-/blob/*/*/openapi.json
          - pattern: https://gitlab.com/*/*/-/blob/*/*/swagger.yaml
          - pattern: https://gitlab.com/*/*/-/blob/*/*/swagger.yml
          - pattern: https://gitlab.com/*/*/-/blob/*/*/swagger.json
          - pattern: https://gitlab.com/*/*/-/blob/*/*/*/openapi.yaml
          - pattern: https://gitlab.com/*/*/-/blob/*/*/*/openapi.yml
          - pattern: https://gitlab.com/*/*/-/blob/*/*/*/openapi.json
          - pattern: https://gitlab.com/*/*/-/blob/*/*/*/swagger.yaml
          - pattern: https://gitlab.com/*/*/-/blob/*/*/*/swagger.yml
          - pattern: https://gitlab.com/*/*/-/blob/*/*/*/swagger.json
          - pattern: https://bitbucket.org/*/*/src/*/openapi.yaml
          - pattern: https://bitbucket.org/*/*/src/*/openapi.yml
          - pattern: https://bitbucket.org/*/*/src/*/openapi.json
          - pattern: https://bitbucket.org/*/*/src/*/swagger.yaml
          - pattern: https://bitbucket.org/*/*/src/*/swagger.yml
          - pattern: https://bitbucket.org/*/*/src/*/swagger.json
          - pattern: https://bitbucket.org/*/*/src/*/*/openapi.yaml
          - pattern: https://bitbucket.org/*/*/src/*/*/openapi.yml
          - pattern: https://bitbucket.org/*/*/src/*/*/openapi.json
          - pattern: https://bitbucket.org/*/*/src/*/*/swagger.yaml
          - pattern: https://bitbucket.org/*/*/src/*/*/swagger.yml
          - pattern: https://bitbucket.org/*/*/src/*/*/swagger.json
          - pattern: https://bitbucket.org/*/*/src/*/*/*/openapi.yaml
          - pattern: https://bitbucket.org/*/*/src/*/*/*/openapi.yml
          - pattern: https://bitbucket.org/*/*/src/*/*/*/openapi.json
          - pattern: https://bitbucket.org/*/*/src/*/*/*/swagger.yaml
          - pattern: https://bitbucket.org/*/*/src/*/*/*/swagger.yml
          - pattern: https://bitbucket.org/*/*/src/*/*/*/swagger.json
          - pattern: https://app.swaggerhub.com/apis/*/*
          - pattern: https://app.swaggerhub.com/apis/*/*/*
          - pattern: https://app.swaggerhub.com/apis-docs/*/*
          - pattern: https://app.swaggerhub.com/apis-docs/*/*/*
      adfExport:
        function: export
      config:
        resource: ui/config
        title: Configure API documentation
        viewportSize: max
        openOnInsert: true
        parameters:
          # attachment type so Confluence keeps the reference if the file is renamed
          - identifier: attachment
            type: attachment
          # title + endpoints, indexed so the page shows up in search
          - identifier: searchText
            type: string
            indexing:
              enabled: true
  confluence:globalSettings:
    - key: specpage-settings
      resource: ui/admin
      resolver:
        function: resolver
      title: SpecPage settings
      useAsConfig: true
  confluence:spacePage:
    - key: specpage-space-apis
      resource: ui/space
      resolver:
        function: resolver
      title: API docs
      route: api-docs
  # Git push webhooks. The URL is public; each request is checked against the
  # connection's secret (see src/backend/webhook.ts).
  webtrigger:
    - key: git-webhook
      function: webhook
      response:
        type: dynamic
  confluence:globalPage:
    - key: specpage-api-catalog
      resource: ui/space
      resolver:
        function: resolver
      title: API catalog
      route: api-catalog
  function:
    - key: resolver
      handler: index.handler
      # Bundling many-file specs and gzip both want headroom over the default.
      runtime:
        memoryMB: 1024
    - key: export
      handler: index.exportHandler
    - key: webhook
      handler: index.webhookHandler

resources:
  - key: ui
    path: static/app/dist
    entry:
      macro: macro.html
      config: config.html
      admin: admin.html
      space: space.html

permissions:
  scopes:
    # settings, git connections, tokens (secret store), spec cache
    - storage:app
    # read spec attachments on the current page
    - read:attachment:confluence
    - readonly:content.attachment:confluence
    # upload or update spec attachments from the macro settings (as the editing user)
    - write:confluence-file
    # page titles and permission checks for the space API list
    - read:page:confluence
    # admin check for the settings page
    - read:confluence-user
  external:
    # Nothing is allowed by default. Admins approve hosts from the settings page
    # (customer-managed egress).
    configurable:
      enabled: true

app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs24.x
    architecture: arm64
    memoryMB: 512
  licensing:
    enabled: true
