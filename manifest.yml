# SpecPage manifest
# https://developer.atlassian.com/platform/forge/manifest-reference/
modules:
  macro:
    - key: specpage-viewer
      resource: ui/macro
      resolver:
        function: resolver
      title: OpenAPI / Swagger docs (SpecPage)
      description: Interactive API docs from an OpenAPI or Swagger spec - page attachment, Git, URL or pasted text.
      category: embed
      # Let guests / anonymous users read docs on public spaces.
      # Try it out is still licensed-users-only (checked in the resolver).
      unlicensedAccess:
        - unlicensed
        - anonymous
      emitsReadyEvent: true
      adfExport:
        function: export
      config:
        resource: ui/config
        title: Configure API documentation
        viewportSize: max
        openOnInsert: true
        parameters:
          # attachment type so Confluence keeps the reference if the file is renamed
          - identifier: attachment
            type: attachment
          # title + endpoints, indexed so the page shows up in search
          - identifier: searchText
            type: string
            indexing:
              enabled: true
  confluence:globalSettings:
    - key: specpage-settings
      resource: ui/admin
      resolver:
        function: resolver
      title: SpecPage settings
      useAsConfig: true
  function:
    - key: resolver
      handler: index.handler
      # Bundling many-file specs and gzip both want headroom over the default.
      runtime:
        memoryMB: 1024
    - key: export
      handler: index.exportHandler

resources:
  - key: ui
    path: static/app/dist
    entry:
      macro: macro.html
      config: config.html
      admin: admin.html

permissions:
  scopes:
    # settings, git connections, tokens (secret store), spec cache
    - storage:app
    # read spec attachments on the current page
    - read:attachment:confluence
    - readonly:content.attachment:confluence
    # admin check for the settings page
    - read:confluence-user
  external:
    # Nothing is allowed by default. Admins approve hosts from the settings page
    # (customer-managed egress).
    configurable:
      enabled: true

app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs24.x
    architecture: arm64
    memoryMB: 512
  licensing:
    enabled: true
