org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configureondemand=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# AGP 9's "built-in Kotlin support" (enabled by default) referenced legacy AGP
# classes (BaseVariant/BaseExtension) that AGP 9.4.0 had already removed,
# crashing regardless of whether this project applied org.jetbrains.kotlin.android
# itself. Disabling it and applying that plugin explicitly (app/build.gradle.kts)
# avoids the broken code path. We also stepped back from AGP 9.4.0/Kotlin
# 2.4.20 (the latest of each, individually) to AGP 9.0.1/Kotlin 2.3.21 - the
# pairing JetBrains/Google actually document and test together for the AGP 9
# migration ("KGP 2.3.0+ has best compatibility" with AGP 9.0). Keeping this
# flag even with that documented pairing is just cheap insurance.
android.builtInKotlin=false
