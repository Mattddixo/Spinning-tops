org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configureondemand=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# AGP 9.x's "built-in Kotlin support" (enabled by default) has a bug where its
# own internal Kotlin Gradle Plugin interop code (KotlinAndroidTarget) still
# references com.android.build.gradle.api.BaseVariant, a class AGP 9.4.0
# itself removed - so it crashes on its own, independent of anything this
# project applies. Disabling it and going back to explicitly applying
# org.jetbrains.kotlin.android (see app/build.gradle.kts) avoids that broken
# code path entirely.
android.builtInKotlin=false
